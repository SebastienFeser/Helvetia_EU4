 hel_swi_perpetual_peace_title:0 "Der Ewige Frieden"
 hel_swi_perpetual_peace_desc:0 "Nach Marignano schloss die Eidgenossenschaft mit Frankreich einen Frieden, der fast drei Jahrhunderte hielt. Gewinnen wir die dauerhafte Freundschaft einer Grossmacht."
 hel_swi_latin_schools_title:0 "Die Lateinschulen"
 hel_swi_latin_schools_desc:0 "Die Stifte und Klöster der Städte bilden die künftigen Magistraten aus. Statten wir unsere Orte mit Schulen aus."
 hel_swi_humanist_scholars_title:0 "Die Humanisten"
 hel_swi_humanist_scholars_desc:0 "Erasmus, Froben und Amerbach machten die Schweizer Städte zu einem Zentrum des Humanismus. Ziehen wir grosse Geister an."
 hel_swi_geneva_academy_title:0 "Die Akademie von Genf"
 hel_swi_geneva_academy_desc:0 "1559 gründete Genf eine Akademie, die Pfarrer und Gelehrte aus ganz Europa ausbildete. Machen wir Genf zu einer Stadt des Wissens."
 hel_swi_cantonal_schools_title:0 "Die Schulen der Orte"
 hel_swi_cantonal_schools_desc:0 "Jede Pfarrei soll ihren Schulmeister haben. Ein gebildetes Volk zahlt besser Steuern und dient der Eidgenossenschaft besser."
 hel_swi_swiss_scholars_title:0 "Die Schweizer Gelehrten"
 hel_swi_swiss_scholars_desc:0 "Die Bernoulli, Euler und Haller trugen die Schweizer Wissenschaft in alle Akademien Europas. Umgeben wir uns mit Gelehrten."
 hel_swi_popular_instruction_title:0 "Die Volksbildung"
 hel_swi_popular_instruction_desc:0 "Pestalozzi wollte Kopf, Herz und Hand jedes Kindes bilden. Machen wir die Bildung zur Sache des ganzen Volkes."
 hel_swi_gotthard_toll_title:0 "Der Gotthardzoll"
 hel_swi_gotthard_toll_desc:0 "Seit der Öffnung des Passes verbindet der Gotthard den Rhein mit der Lombardei. Organisieren wir den Übergang und erheben wir unseren Anteil."
 hel_swi_cattle_trade_title:0 "Vieh und Käse"
 hel_swi_cattle_trade_desc:0 "Das Vieh und der Käse der Alpen gehen auf die Märkte der Lombardei. Bauen wir die Viehzucht aus."
 hel_swi_trade_fairs_title:0 "Die Messen"
 hel_swi_trade_fairs_desc:0 "Die Messen von Genf und Zurzach ziehen Kaufleute aus ganz Europa an. Öffnen wir unsere Städte dem Handel."
 hel_swi_alpine_roads_title:0 "Die Passstrassen"
 hel_swi_alpine_roads_desc:0 "Brücken, Saumwege und Susten halten die Pässe das ganze Jahr offen. Erschliessen wir unsere Bergtäler."
 hel_swi_huguenot_crafts_title:0 "Indiennes und Uhrmacherei"
 hel_swi_huguenot_crafts_desc:0 "Hugenottische Flüchtlinge bringen den Zeugdruck und die Uhrmacherei. Nehmen wir ihre Werkstätten auf."
 hel_swi_swiss_banks_title:0 "Die Schweizer Banken"
 hel_swi_swiss_banks_desc:0 "Die Bankiers von Genf und Basel leihen den Königen Europas. Halten wir unsere Rechnungen in Ordnung."
