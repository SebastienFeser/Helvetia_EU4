l_german:
 hel_swi_stans_convenant_title:0 "Das Stanser Verkommnis"
 hel_swi_stans_convenant_desc:0 "1481 hätten Stadt und Land die Eidgenossenschaft beinahe zerrissen. In Stans fanden sie auf den Rat des Einsiedlers Niklaus von Flüe einen Kompromiss. Zeigen wir, dass die Eidgenossenschaft zusammenhält."
 hel_swi_integrate_cantons_title:0 "Die Orte eingliedern"
 hel_swi_integrate_cantons_desc:0 "Jedes Tal der alten Eidgenossenschaft soll sich ganz als eidgenössisch fühlen. Machen wir unsere Schweizer Lande zu vollwertigen Orten."
 hel_swi_federal_diet_title:0 "Die Tagsatzung"
 hel_swi_federal_diet_desc:0 "Die Tagsatzung versammelt die Gesandten aller Orte. Damit sie funktioniert, müssen Klerus, Patriziat und Gemeinden gleichermassen zu ihrem Recht kommen."
 hel_swi_confederate_cities_title:0 "Die Städte der Eidgenossenschaft"
 hel_swi_confederate_cities_desc:0 "Bern, Zürich, Basel und Luzern sind Zentren von Handel und Handwerk. Ihre Zünfte sind der Reichtum der Eidgenossenschaft."
 hel_swi_thirteen_cantons_title:0 "Die Dreizehn Orte"
 hel_swi_thirteen_cantons_desc:0 "Eine starke Eidgenossenschaft ruht auf wohlhabenden Orten. Entwickeln wir das Herz der Schweiz."
 hel_swi_patriciate_and_communes_title:0 "Patriziat und Gemeinden"
 hel_swi_patriciate_and_communes_desc:0 "Die Familien der Städte und die Bauern der Täler ringen um die Macht. Beide müssen zufrieden sein."
 hel_swi_zurich_reformation_title:0 "Die Zürcher Reformation"
 hel_swi_zurich_reformation_desc:0 "1522 brechen Zürcher Bürger das Fastengebot und essen Würste. Zwingli stellt sich auf ihre Seite. Die Reformation ist im Gang, und die Eidgenossenschaft muss Antwort geben."
 hel_swi_voice_of_the_people_title:0 "Die Stimme des Volkes"
 hel_swi_voice_of_the_people_desc:0 "Das in der Landsgemeinde versammelte Volk stimmt über seine Gesetze ab. Achten wir seine Stimme, und die Republik wird gestärkt."
 hel_swi_confessional_peace_title:0 "Der Konfessionsfriede"
 hel_swi_confessional_peace_desc:0 "Kappel und Villmergen haben den Preis religiöser Zwietracht gezeigt. Ist unser Weg einmal gewählt, müssen wir den Frieden zwischen den Orten wiederherstellen."
 hel_swi_peasants_war_title:0 "Der Bauernkrieg"
 hel_swi_peasants_war_desc:0 "1653 erhob sich das Land gegen die Steuern der Städte und wurde niedergeschlagen. Machen wir es besser: Halten wir das Land zufrieden, ohne je die Waffen gegen es zu erheben."
 hel_swi_act_of_mediation_title:0 "Die Mediationsakte"
 hel_swi_act_of_mediation_desc:0 "Die Eidgenossenschaft muss sich dauerhafte Einrichtungen geben, die die Autonomie der Orte achten und doch das Ganze regieren."
 hel_swi_alpine_bastions_title:0 "Alpenbollwerke"
 hel_swi_alpine_bastions_desc:0 "Die Pässe sind unsere Wälle. Befestigen wir die Berge, und kein Heer wird durchkommen."
 hel_swi_swiss_guard_title:0 "Die Schweizergarde"
 hel_swi_swiss_guard_desc:0 "Der Papst wünscht sich wie der König von Frankreich Schweizer als Garde. Gewinnen wir das Vertrauen der fremden Höfe."
 hel_swi_mercenary_companies_title:0 "Die Söldnerkompanien"
 hel_swi_mercenary_companies_desc:0 "Unsere Regimenter dienen in ganz Europa. Ordnen wir dieses Geschäft so, dass es auch der Eidgenossenschaft dient."
 hel_swi_defensional_of_wil_title:0 "Das Defensional von Wil"
 hel_swi_defensional_of_wil_desc:0 "1647 schufen die Orte zum Schutz vor dem Dreissigjährigen Krieg ein gemeinsames eidgenössisches Heer. Machen wir unsere Verteidigung professionell."
 hel_swi_recognized_neutrality_title:0 "Anerkannte Neutralität"
 hel_swi_recognized_neutrality_desc:0 "Neutralität ist nur etwas wert, wenn die Mächte an sie glauben. Zwanzig Jahre Frieden und ein Heer, bereit die Pässe zu verteidigen, machen sie unanfechtbar."

 hel_unlock_cantonal_autonomy_tt:0 "Schaltet die Reform §YKantonale Autonomie§! frei."
 hel_unlock_armed_neutrality_tt:0 "Schaltet die Reform §YBewaffnete Neutralität§! frei."
 hel_twenty_years_of_peace_tt:0 "Seit mindestens §Y20 Jahren§! kein Krieg."

