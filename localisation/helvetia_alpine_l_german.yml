l_german:
 ALP:0 "Alpine Eidgenossenschaft"
 ALP_ADJ:0 "alpin"
 HEL_ALP_ideas:0 "Alpine Ideen"
 HEL_ALP_ideas_start:0 "Alpine Traditionen"
 HEL_ALP_ideas_bonus:0 "Alpine Ambitionen"
 hel_alp_pass_tolls:0 "Die Passzölle"
 hel_alp_pass_tolls_desc:0 "Vom Gotthard bis zum Brenner, vom Simplon bis zum Mont Cenis zieht aller Handel zwischen Italien und dem Norden über unsere Pässe und zahlt unseren Zoll."
 hel_alp_pestalozzi_school:0 "Pestalozzis Schule"
 hel_alp_pestalozzi_school_desc:0 "Johann Heinrich Pestalozzi will das ganze Volk bilden, mit Kopf, Herz und Hand. Ein Volk, das abstimmt, muss lesen können."
 hel_alp_alpine_redoubt:0 "Das Alpenréduit"
 hel_alp_alpine_redoubt_desc:0 "Überschreitet der Feind unsere Grenzen, ziehen wir uns in die Berge zurück, wo jeder Pass eine Festung ist."
 hel_alp_perpetual_neutrality:0 "Immerwährende Neutralität"
 hel_alp_perpetual_neutrality_desc:0 "Die Mächte anerkennen und garantieren unsere Neutralität. Wir ergreifen für niemanden Partei, und niemand bedroht uns."
 hel_alp_geneva_basel_banks:0 "Die Banken von Genf und Basel"
 hel_alp_geneva_basel_banks_desc:0 "Die Bankiers von Genf und Basel leihen den Höfen ganz Europas. Ihr Kredit ist der unsere."
 hel_alp_federalism:0 "Der Föderalismus"
 hel_alp_federalism_desc:0 "Jeder Kanton verwaltet sich selbst; der Bund regiert nur das Gemeinsame. So bleibt ein so grosses Ganzes regierbar."
 hel_alp_alpine_ports:0 "Die Häfen der Alpen"
 hel_alp_alpine_ports_desc:0 "Genua, Venedig und Marseille sind die Ausgänge unserer Pässe. Von dort stechen unsere Kaufleute in See."
 hel_alpine_confederation_reform:0 "Bund der Alpen"
 hel_alpine_confederation_reform_desc:0 "Kantone aller Sprachen, von der Rhone bis zur Donau, vereint durch einen Bundesbrief. Gemeinsam hüten sie die Alpen."
 hel_form_alpine_confederation_title:0 "Die Alpine Eidgenossenschaft gründen"
 hel_form_alpine_confederation_desc:0 "Von den Seealpen bis zu den Julischen Alpen gehören uns alle Pässe. Die alte Eidgenossenschaft wird zur Hüterin aller Alpen, einer neutralen Macht, die niemand anzugreifen wagt."
