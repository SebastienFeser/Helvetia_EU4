l_french:
 hel_swi_romandie_title:0 "La Romandie"
 hel_swi_romandie_desc:0 "Le Vaud et le Valais sont tenus par la Savoie, Genève hésite entre le duc et les Confédérés. Liez Genève par la combourgeoisie et chassez la Savoie des rives du Léman."
 hel_swi_burgundian_wars_title:0 "Les guerres de Bourgogne"
 hel_swi_burgundian_wars_desc:0 "Le Téméraire rêve d'un royaume entre France et Empire. À Grandson, Morat et Nancy, faisons mieux que nos ancêtres : gardons la Franche-Comté et la Bourgogne au lieu de les vendre."
 hel_swi_alsace_title:0 "L'Alsace"
 hel_swi_alsace_desc:0 "Mulhouse est notre alliée depuis longtemps. Avec elle, ramenons le Sundgau et l'Alsace dans l'orbite de la Confédération."
 hel_swi_savoy_dauphine_title:0 "Savoie et Dauphiné"
 hel_swi_savoy_dauphine_desc:0 "Les cols du Mont-Cenis et du Petit-Saint-Bernard s'ouvrent sur la Savoie et le Dauphiné. Qui les tient tient la route de Lyon."
 hel_swi_provence_title:0 "La Provence"
 hel_swi_provence_desc:0 "Au bout de la route des Alpes du Sud, Marseille et Toulon ouvrent la Méditerranée. Quant à Avignon, cité des papes, elle ne se prend pas : elle se négocie."
 hel_swi_swabian_cities_title:0 "Constance et les villes souabes"
 hel_swi_swabian_cities_desc:0 "Constance, Ulm, Augsbourg et Memmingen regardent vers le sud. Leurs bourgeois rêvent de « devenir suisses ». Accueillons-les par la combourgeoisie ou l'alliance."
 hel_swi_swabian_war_title:0 "La guerre de Souabe"
 hel_swi_swabian_war_desc:0 "En 1499, à Dornach, les Confédérés ont battu l'Empereur et la Ligue souabe. Allons plus loin : le Wurtemberg, Bade et le Brisgau."
 hel_swi_palatinate_title:0 "Le Palatinat"
 hel_swi_palatinate_desc:0 "Le Palatinat du Rhin tient le fleuve en aval de Bâle. Sécurisons tout le Rhin supérieur."
 hel_swi_salzburg_lower_bavaria_title:0 "Salzbourg et la Basse-Bavière"
 hel_swi_salzburg_lower_bavaria_desc:0 "Salzbourg, Passau et la Basse-Bavière commandent le Danube et les Alpes du Nord. Prenons pied à l'est."
 hel_swi_bavaria_title:0 "La Bavière"
 hel_swi_bavaria_desc:0 "Munich et la Haute-Bavière sont le cœur des Wittelsbach. Leur défaite ouvre la route du nord."
 hel_swi_franconia_title:0 "La Franconie"
 hel_swi_franconia_desc:0 "Nuremberg est le grand marché du nord sur la route du Brenner vers Venise. Contrôlons-en les deux bouts."
 hel_swi_grisons_title:0 "Les Grisons"
 hel_swi_grisons_desc:0 "Les Trois Ligues sont nos alliées naturelles et gardent les cols de l'Engadine et du Splügen. Faisons-en des Confédérés."
 hel_swi_tyrol_title:0 "Le Tyrol de Gaismair"
 hel_swi_tyrol_desc:0 "En 1526, Michael Gaismair rêvait d'une république paysanne au Tyrol et cherchait l'appui de Zurich. Faisons de son rêve une réalité : le Tyrol, le Vorarlberg et Trente."
 hel_swi_austria_title:0 "L'Autriche"
 hel_swi_austria_desc:0 "L'ennemi héréditaire doit tomber. Jusqu'à Vienne, la Styrie et la Carinthie."
 hel_swi_slovenia_title:0 "La Slovénie"
 hel_swi_slovenia_desc:0 "En 1515, les paysans slovènes se sont soulevés contre leurs seigneurs. Soutenons-les et achevons la maîtrise des Alpes orientales, jusqu'à Trieste."
 hel_swi_end_of_habsburgs_title:0 "La fin des Habsbourg"
 hel_swi_end_of_habsburgs_desc:0 "La maison née au château de Habsbourg, en Argovie, ne règne plus nulle part. Avec elle s'effondre le Saint-Empire."
 hel_swi_ticino_milan_title:0 "Le Tessin et Milan"
 hel_swi_ticino_milan_desc:0 "À Giornico, nous avons battu Milan pour le Tessin. En 1512, nous avons rétabli les Sforza et protégé Milan. Faisons de la Lombardie un protectorat durable, ou une terre confédérée."
 hel_swi_po_valley_title:0 "La vallée du Pô"
 hel_swi_po_valley_desc:0 "Bergame, Brescia et Mantoue relient la Lombardie à la Vénétie."
 hel_swi_piedmont_genoa_title:0 "Le Piémont et Gênes"
 hel_swi_piedmont_genoa_desc:0 "Gênes est le port naturel des cols suisses. Le Piémont en garde l'accès."
 hel_swi_venetia_title:0 "La Vénétie"
 hel_swi_venetia_desc:0 "En 1508, toute l'Europe s'est liguée contre Venise à Cambrai. Le débouché du Brenner doit être à nous."
 hel_swi_corsica_sardinia_title:0 "La Corse et la Sardaigne"
 hel_swi_corsica_sardinia_desc:0 "Maîtres de Gênes, nous devons tenir ses îles pour protéger nos routes en Méditerranée."

 hel_unlock_avignon_tt:0 "Débloque la décision §YNégocier Avignon§! avec la papauté."
 hel_dismantle_hre_tt:0 "Le §RSaint-Empire romain germanique§! sera démantelé."
 hel_negotiate_avignon_title:0 "Négocier Avignon"
 hel_negotiate_avignon_desc:0 "La cité des papes ne se prend pas par les armes. Offrons à la papauté une juste compensation, et Avignon rejoindra pacifiquement la Confédération."
 hel_avignon_bought:0 "Avignon négociée"
 hel_swiss_way:0 "La voie suisse"
 hel_brenner_route:0 "La route du Brenner"
 hel_eastern_alps:0 "Les Alpes orientales"
 hel_end_of_habsburgs:0 "La fin des Habsbourg"
 hel_venetian_trade:0 "Le commerce vénitien"
 hel_mediterranean_outlet:0 "Le débouché méditerranéen"
 hel_rhine_trade:0 "Commerce du Rhin"
