l_german:
 estate_hel_communes:0 "Gemeinden"
 estate_hel_communes_desc:0 "Die ländlichen Gemeinden und die Landleute der Täler regieren sich seit Jahrhunderten selbst. In der Landsgemeinde versammelt, stimmen sie über Gesetze, Steuern und Bündnisse ab und stellen die Männer der Miliz."
 estate_hel_patriciate:0 "Patriziat"
 hel_communes_loyalty_modifier:0 "Loyalitätsgleichgewicht der Gemeinden"
 hel_communes_influence_modifier:0 "Einfluss der Gemeinden"
 hel_communes_privilege_slots:0 "Max. Privilegien der Gemeinden"
 hel_local_communes_displeased:0 "Unzufriedene örtliche Gemeinden"
 hel_people_betrayed:0 "Verratenes Volk"
 hel_people_betrayed_desc:0 "Das Volk hat das Recht verloren, über seine Gesetze abzustimmen. In den Tälern wächst der Zorn."

 estate_hel_communes_land_rights:0 "Gemeinderechte"
 estate_hel_communes_land_rights_desc:0 "Die Gemeinden verwalten ihr Land, ihre Alpweiden und Wälder selbst."
 estate_hel_communes_primacy:0 "Vorrang der Gemeinden"
 estate_hel_communes_primacy_desc:0 "Die Gemeinden heben ihre eigenen Kontingente aus, rüsten sie aus und führen sie. Ohne sie wird kein Heer aufgeboten."
 estate_hel_communes_levies:0 "Aufgebot der Täler"
 estate_hel_communes_levies_desc:0 "Jedes Tal stellt seine Männer für die Miliz und erhält dafür geringere Steuern."
 estate_hel_communes_officer_corp:0 "Milizoffiziere"
 estate_hel_communes_officer_corp_desc:0 "Von den Gemeinden gewählte Hauptleute führen die Miliz und geben die Erfahrung vergangener Feldzüge weiter."
 estate_hel_communes_advisors:0 "Ratgeber der Täler"
 estate_hel_communes_advisors_desc:0 "Ehemalige Hauptleute der Gemeinden beraten die Tagsatzung in militärischen Fragen."
 estate_hel_communes_direct_democracy:0 "Direkte Demokratie"
 estate_hel_communes_direct_democracy_desc:0 "Das versammelte Volk stimmt über Gesetze und grosse Entscheidungen ab. Das ist die Stärke der Eidgenossenschaft, aber auch eine Pflicht: Wer den Volkswillen missachtet, verliert viel republikanische Legitimität."

 estate_hel_communes_develop_x:0 "[agenda_province.GetName] entwickeln"
 estate_hel_communes_develop_x_desc:0 "Die Gemeinden verlangen, dass wir in den Wohlstand von [agenda_province.GetName] investieren. Das Volk hat abgestimmt und erwartet Taten."
 estate_hel_communes_build_fort_building_in_y:0 "[agenda_province.GetName] befestigen"
 estate_hel_communes_build_fort_building_in_y_desc:0 "Die Gemeinden fordern, dass wir [agenda_province.GetName] befestigen. Pässe und Täler müssen gehalten werden."
 estate_hel_communes_build_up_manpower_reserves:0 "Unsere Mannschaftsreserven auffüllen"
 estate_hel_communes_build_up_manpower_reserves_desc:0 "Die Täler sind von ihren Männern entleert. Die Gemeinden verlangen eine Pause, damit sich unsere Reserven erholen."
 estate_hel_communes_crush_revolts:0 "Die Ordnung wiederherstellen"
 estate_hel_communes_crush_revolts_desc:0 "Die Gemeinden verlangen, dass wir die Ordnung wiederherstellen und den Aufständen ein Ende setzen."
 estate_hel_communes_retake_core:0 "[agenda_province.GetName] zurückerobern"
 estate_hel_communes_retake_core_desc:0 "[agenda_province.GetName] gehört zur Eidgenossenschaft. Die Gemeinden verlangen, dass wir es zurückholen."
 estate_hel_communes_relations_with_X:0 "Beziehungen zu [agenda_country.GetUsableName] verbessern"
 estate_hel_communes_relations_with_X_desc:0 "Die Gemeinden sehen in [agenda_country.GetUsableName] einen Nachbarn, dessen Freundschaft uns schützen würde. Sie wünschen engere Bande."
 estate_hel_communes_hire_advisor:0 "Einen militärischen Berater einstellen"
 estate_hel_communes_hire_advisor_desc:0 "Die Gemeinden wünschen, dass ein militärischer Berater an der Tagsatzung sitzt."

 estate_burghers_hel_military_capitulations:0 "Militärkapitulationen"
 estate_burghers_hel_military_capitulations_desc:0 "Die grossen Familien handeln die Verträge unserer Regimenter mit fremden Höfen aus und ziehen daraus Geld und Einfluss."
 estate_burghers_hel_renew_capitulations:0 "Die Kapitulationen mit [agenda_country.GetUsableName] erneuern"
 estate_burghers_hel_renew_capitulations_desc:0 "Das Patriziat möchte die Verträge unserer Regimenter mit [agenda_country.GetUsableName] erneuern. Dazu müssen wir ihr volles Vertrauen gewinnen."
