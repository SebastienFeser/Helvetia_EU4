l_french:
 HEL_SWI_ideas:0 "Idées suisses"
 HEL_SWI_ideas_start:0 "Traditions suisses"
 HEL_SWI_ideas_bonus:0 "Ambition suisse"
 hel_swi_piquiers:0 "Les piquiers"
 hel_swi_piquiers_desc:0 "Serrés en carrés hérissés de piques, les Confédérés ont brisé la chevalerie bourguignonne à Grandson, Morat et Nancy. Aucune infanterie d'Europe ne leur résiste."
 hel_swi_milice_cantonale:0 "La milice cantonale"
 hel_swi_milice_cantonale_desc:0 "Dans les cantons, chaque homme libre doit porter les armes. Chaque vallée peut lever ses hommes en quelques jours, sans armée permanente."
 hel_swi_reislaufen:0 "Le Reislaufen"
 hel_swi_reislaufen_desc:0 "Les rois de France, les papes et les ducs de Milan se disputent nos soldats. Les capitulations font entrer l'or étranger dans les cantons et donnent à nos hommes une expérience sans égale."
 hel_swi_commerce_betail:0 "Le commerce du bétail"
 hel_swi_commerce_betail_desc:0 "Chaque automne, nos troupeaux et nos fromages franchissent les cols vers les marchés de Lombardie. Les alpages sont la richesse des vallées."
 hel_swi_bale_imprimeuse:0 "Bâle l'imprimeuse"
 hel_swi_bale_imprimeuse_desc:0 "Depuis la fondation de son université en 1460, Bâle attire savants et imprimeurs. Les presses de Froben y publient Érasme, et les idées nouvelles se répandent dans toute l'Europe."
 hel_swi_zwingli_bullinger:0 "Zwingli et Bullinger"
 hel_swi_zwingli_bullinger_desc:0 "À Zurich, Zwingli puis Bullinger ont donné à la foi une rigueur et une doctrine communes, que fixe la Confession helvétique de 1566."
 hel_swi_refuge_huguenot:0 "Le Refuge huguenot"
 hel_swi_refuge_huguenot_desc:0 "Chassés de France, les huguenots trouvent asile dans nos villes. Ils apportent avec eux l'horlogerie, la soierie et la banque."
