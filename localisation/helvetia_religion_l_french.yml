l_french:
 hel_religion.1.t:0 "La Confédération à la croisée des chemins"
 hel_religion.1.d:0 "Zurich, Berne et Bâle ont embrassé la Réforme, tandis que les cantons de Suisse centrale restent fidèles à Rome. À Trente, l'Église se prépare à répondre aux hérétiques. Les deux camps se sont déjà affrontés à Kappel. La Diète doit dire quelle voie suivra la Confédération : celle de Rome, celle des réformateurs, ou une paix qui laisse chaque canton libre de sa foi."
 hel_religion.1.a:0 "Rome. La Confédération restera fidèle à l'Église."
 hel_religion.1.b:0 "Zurich et Genève. La Confédération sera réformée."
 hel_religion.1.c:0 "La paix des confessions. Chaque canton garde sa foi."
 hel_renounce_confessional_neutrality_title:0 "Renoncer à la neutralité confessionnelle"
 hel_renounce_confessional_neutrality_desc:0 "Mettre fin à la paix des confessions pour imposer une seule foi. Les cantons ne l'accepteront pas sans heurts, et il n'y aura pas de retour en arrière."
 hel_golden_league:0 "La Ligue d'or"
 hel_golden_league_desc:0 "Les cantons catholiques se sont unis pour défendre la foi de Rome."
 hel_helvetic_reformation:0 "La Réforme helvétique"
 hel_helvetic_reformation_desc:0 "De Zurich à Genève, la foi réformée façonne la Confédération."
 hel_confessional_neutrality:0 "Neutralité confessionnelle"
 hel_confessional_neutrality_desc:0 "Chaque canton choisit sa foi. Personne ne convertit son voisin, et les chrétiens de toutes confessions vivent en paix sous la même bannière."
 hel_confessions_torn:0 "Confessions déchirées"
 hel_confessions_torn_desc:0 "La paix des confessions est rompue. Les cantons se méfient les uns des autres."
