l_french:
 ALP:0 "Confédération alpine"
 ALP_ADJ:0 "alpin"
 HEL_ALP_ideas:0 "Idées alpines"
 HEL_ALP_ideas_start:0 "Traditions alpines"
 HEL_ALP_ideas_bonus:0 "Ambition alpine"
 hel_alp_pass_tolls:0 "Les péages des cols"
 hel_alp_pass_tolls_desc:0 "Du Gothard au Brenner, du Simplon au Mont-Cenis, tout le commerce entre l'Italie et le nord passe par nos cols et paie notre péage."
 hel_alp_pestalozzi_school:0 "L'école de Pestalozzi"
 hel_alp_pestalozzi_school_desc:0 "Johann Heinrich Pestalozzi veut instruire le peuple tout entier, la tête, le cœur et la main. Un peuple qui vote doit savoir lire."
 hel_alp_alpine_redoubt:0 "Le Réduit alpin"
 hel_alp_alpine_redoubt_desc:0 "Si l'ennemi franchit nos frontières, nous nous replierons dans les montagnes, où chaque col est une forteresse."
 hel_alp_perpetual_neutrality:0 "La neutralité perpétuelle"
 hel_alp_perpetual_neutrality_desc:0 "Les puissances reconnaissent notre neutralité et la garantissent. Nous ne prenons parti pour personne, et personne ne nous menace."
 hel_alp_geneva_basel_banks:0 "Les banques de Genève et de Bâle"
 hel_alp_geneva_basel_banks_desc:0 "Les banquiers de Genève et de Bâle prêtent aux cours de toute l'Europe. Leur crédit est le nôtre."
 hel_alp_federalism:0 "Le fédéralisme"
 hel_alp_federalism_desc:0 "Chaque canton s'administre lui-même ; la Confédération ne gouverne que ce qui est commun. C'est ainsi qu'un si grand ensemble reste gouvernable."
 hel_alp_alpine_ports:0 "Les ports des Alpes"
 hel_alp_alpine_ports_desc:0 "Gênes, Venise et Marseille sont les débouchés de nos cols. Nos marchands y prennent la mer."
 hel_alpine_confederation_reform:0 "Confédération des Alpes"
 hel_alpine_confederation_reform_desc:0 "Des cantons de toutes langues, du Rhône au Danube, unis par un pacte fédéral. Ensemble, ils gardent les Alpes."
 hel_form_alpine_confederation_title:0 "Former la Confédération alpine"
 hel_form_alpine_confederation_desc:0 "Des Alpes maritimes aux Alpes juliennes, tous les cols sont à nous. La vieille Confédération devient la gardienne de toutes les Alpes, une puissance neutre que nul n'ose attaquer."
