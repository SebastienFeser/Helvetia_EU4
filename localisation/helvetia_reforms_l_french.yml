l_french:
 hel_cantonal_autonomy_reform:0 "Autonomie cantonale"
 hel_cantonal_autonomy_reform_desc:0 "Chaque canton garde ses lois, ses impôts et ses tribunaux. La Confédération est une alliance de souverains, pas un État. La retirer serait une trahison que les cantons ne pardonneraient pas."
 hel_federal_militia_reform:0 "Milice fédérale"
 hel_federal_militia_reform_desc:0 "Sur le modèle du Défensional de Wil (1647), les cantons fournissent chacun leur contingent à une armée fédérale de milice, levée seulement quand la patrie est menacée."
 hel_armed_neutrality_reform:0 "Neutralité armée"
 hel_armed_neutrality_reform_desc:0 "La Confédération ne prend plus parti dans les querelles des puissances. Elle défend ses cols avec acharnement, mais toute guerre d'agression trahirait son serment."
 hel_cantons_betrayed:0 "Cantons trahis"
 hel_cantons_betrayed_desc:0 "Les cantons ont perdu leur autonomie. Dans les vallées, on parle de résistance."
 hel_neutrality_broken:0 "Neutralité rompue"
 hel_neutrality_broken_desc:0 "Les puissances ne croient plus à notre parole de neutralité."
 hel_neutrality_defensive_war:0 "Défense de la neutralité"
 hel_neutrality_defensive_war_desc:0 "Attaquée, la Confédération se lève comme un seul homme."
 hel_neutrality_offensive_war:0 "Neutralité violée"
 hel_neutrality_offensive_war_desc:0 "Une guerre d'agression contredit notre neutralité. Le peuple et les cantons la désapprouvent."
 hel_cantonal_tolerance:0 "Tolérance cantonale"
 hel_cantonal_tolerance_desc:0 "Ici, on parle une autre langue que dans la capitale, mais le canton se gouverne lui-même et n'en est pas moins confédéré."
 hel_reforms.1.t:0 "Tolérance cantonale accordée"
 hel_reforms.1.d:0 ""
 hel_reforms.2.t:0 "Tolérance cantonale retirée"
 hel_reforms.2.d:0 ""
 hel_communal_liberties_reform:0 "Libertés communales"
 hel_communal_liberties_reform_desc:0 "Les communes des vallées gardent leurs franchises : elles élisent leurs juges, gèrent leurs alpages et règlent leurs affaires sans seigneur. En échange, elles restent fidèles à la Confédération."
