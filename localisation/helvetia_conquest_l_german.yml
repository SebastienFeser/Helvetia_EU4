l_german:
 hel_swi_romandie_title:0 "Die Romandie"
 hel_swi_romandie_desc:0 "Waadt und Wallis sind in savoyischer Hand, Genf schwankt zwischen dem Herzog und den Eidgenossen. Binden wir Genf durch ein Burgrecht und vertreiben wir Savoyen vom Genfersee."
 hel_swi_burgundian_wars_title:0 "Die Burgunderkriege"
 hel_swi_burgundian_wars_desc:0 "Karl der Kühne träumt von einem Königreich zwischen Frankreich und dem Reich. Bei Grandson, Murten und Nancy wollen wir es besser machen als unsere Vorfahren: Behalten wir die Freigrafschaft und Burgund, statt sie zu verkaufen."
 hel_swi_alsace_title:0 "Das Elsass"
 hel_swi_alsace_desc:0 "Mülhausen ist seit Langem unser Verbündeter. Mit ihm holen wir den Sundgau und das Elsass in den Bannkreis der Eidgenossenschaft."
 hel_swi_savoy_dauphine_title:0 "Savoyen und Dauphiné"
 hel_swi_savoy_dauphine_desc:0 "Die Pässe des Mont Cenis und des Kleinen St. Bernhard öffnen sich nach Savoyen und in die Dauphiné. Wer sie hält, hält die Strasse nach Lyon."
 hel_swi_provence_title:0 "Die Provence"
 hel_swi_provence_desc:0 "Am Ende der Strasse durch die Südalpen öffnen Marseille und Toulon das Mittelmeer. Avignon aber, die Stadt der Päpste, wird nicht erobert: Über sie wird verhandelt."
 hel_swi_swabian_cities_title:0 "Konstanz und die schwäbischen Städte"
 hel_swi_swabian_cities_desc:0 "Konstanz, Ulm, Augsburg und Memmingen blicken nach Süden. Ihre Bürger träumen davon, «schweizerisch zu werden». Nehmen wir sie durch Burgrecht oder Bündnis auf."
 hel_swi_swabian_war_title:0 "Der Schwabenkrieg"
 hel_swi_swabian_war_desc:0 "1499 schlugen die Eidgenossen bei Dornach den Kaiser und den Schwäbischen Bund. Gehen wir weiter: Württemberg, Baden und der Breisgau."
 hel_swi_palatinate_title:0 "Die Pfalz"
 hel_swi_palatinate_desc:0 "Die Kurpfalz beherrscht den Rhein unterhalb Basels. Sichern wir den ganzen Oberrhein."
 hel_swi_salzburg_lower_bavaria_title:0 "Salzburg und Niederbayern"
 hel_swi_salzburg_lower_bavaria_desc:0 "Salzburg, Passau und Niederbayern beherrschen die Donau und die Nordalpen. Fassen wir im Osten Fuss."
 hel_swi_bavaria_title:0 "Bayern"
 hel_swi_bavaria_desc:0 "München und Oberbayern sind das Herz der Wittelsbacher. Ihre Niederlage öffnet den Weg nach Norden."
 hel_swi_franconia_title:0 "Franken"
 hel_swi_franconia_desc:0 "Nürnberg ist der grosse Markt des Nordens an der Brennerstrasse nach Venedig. Beherrschen wir beide Enden."
 hel_swi_grisons_title:0 "Graubünden"
 hel_swi_grisons_desc:0 "Die Drei Bünde sind unsere natürlichen Verbündeten und hüten die Pässe des Engadins und des Splügens. Machen wir sie zu Eidgenossen."
 hel_swi_tyrol_title:0 "Gaismairs Tirol"
 hel_swi_tyrol_desc:0 "1526 träumte Michael Gaismair von einer Bauernrepublik in Tirol und suchte die Unterstützung Zürichs. Machen wir seinen Traum wahr: Tirol, Vorarlberg und Trient."
 hel_swi_austria_title:0 "Österreich"
 hel_swi_austria_desc:0 "Der Erbfeind muss fallen. Bis nach Wien, in die Steiermark und nach Kärnten."
 hel_swi_slovenia_title:0 "Slowenien"
 hel_swi_slovenia_desc:0 "1515 erhoben sich die slowenischen Bauern gegen ihre Herren. Unterstützen wir sie und vollenden wir die Herrschaft über die Ostalpen, bis nach Triest."
 hel_swi_end_of_habsburgs_title:0 "Das Ende der Habsburger"
 hel_swi_end_of_habsburgs_desc:0 "Das Haus, das auf der Habsburg im Aargau entstand, herrscht nirgends mehr. Mit ihm bricht das Heilige Römische Reich zusammen."
 hel_swi_ticino_milan_title:0 "Tessin und Mailand"
 hel_swi_ticino_milan_desc:0 "Bei Giornico schlugen wir Mailand um das Tessin. 1512 setzten wir die Sforza wieder ein und schützten Mailand. Machen wir die Lombardei zu einem dauerhaften Protektorat oder zu eidgenössischem Land."
 hel_swi_po_valley_title:0 "Die Poebene"
 hel_swi_po_valley_desc:0 "Bergamo, Brescia und Mantua verbinden die Lombardei mit Venetien."
 hel_swi_piedmont_genoa_title:0 "Piemont und Genua"
 hel_swi_piedmont_genoa_desc:0 "Genua ist der natürliche Hafen der Schweizer Pässe. Das Piemont bewacht den Weg dorthin."
 hel_swi_venetia_title:0 "Venetien"
 hel_swi_venetia_desc:0 "1508 verbündete sich in Cambrai ganz Europa gegen Venedig. Der Ausgang des Brenners muss uns gehören."
 hel_swi_corsica_sardinia_title:0 "Korsika und Sardinien"
 hel_swi_corsica_sardinia_desc:0 "Als Herren Genuas müssen wir seine Inseln halten, um unsere Wege im Mittelmeer zu schützen."

 hel_unlock_avignon_tt:0 "Schaltet den Beschluss §YÜber Avignon verhandeln§! mit dem Papsttum frei."
 hel_dismantle_hre_tt:0 "Das §RHeilige Römische Reich§! wird aufgelöst."
 hel_negotiate_avignon_title:0 "Über Avignon verhandeln"
 hel_negotiate_avignon_desc:0 "Die Stadt der Päpste wird nicht mit Waffen genommen. Bieten wir dem Papsttum eine gerechte Entschädigung, und Avignon wird sich friedlich der Eidgenossenschaft anschliessen."
