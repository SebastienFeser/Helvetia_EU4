l_english:
 HEL_SWI_ideas:0 "Swiss Ideas"
 HEL_SWI_ideas_start:0 "Swiss Traditions"
 HEL_SWI_ideas_bonus:0 "Swiss Ambition"
 hel_swi_piquiers:0 "The Pikemen"
 hel_swi_piquiers_desc:0 "Packed into squares bristling with pikes, the Confederates shattered Burgundian chivalry at Grandson, Murten and Nancy. No infantry in Europe can stand against them."
 hel_swi_milice_cantonale:0 "The Cantonal Militia"
 hel_swi_milice_cantonale_desc:0 "In the cantons every free man must bear arms. Any valley can raise its men within days, without a standing army."
 hel_swi_reislaufen:0 "Reislaufen"
 hel_swi_reislaufen_desc:0 "The kings of France, the popes and the dukes of Milan compete for our soldiers. The capitulations bring foreign gold into the cantons and give our men unmatched experience."
 hel_swi_commerce_betail:0 "The Cattle Trade"
 hel_swi_commerce_betail_desc:0 "Every autumn our herds and cheeses cross the passes to the markets of Lombardy. The alpine pastures are the wealth of the valleys."
 hel_swi_bale_imprimeuse:0 "Basel the Printer"
 hel_swi_bale_imprimeuse_desc:0 "Since its university was founded in 1460, Basel has drawn scholars and printers. Froben's presses publish Erasmus, and new ideas spread across Europe."
 hel_swi_zwingli_bullinger:0 "Zwingli and Bullinger"
 hel_swi_zwingli_bullinger_desc:0 "In Zurich, Zwingli and then Bullinger gave the faith a common rigour and doctrine, set down in the Helvetic Confession of 1566."
 hel_swi_refuge_huguenot:0 "The Huguenot Refuge"
 hel_swi_refuge_huguenot_desc:0 "Driven out of France, the Huguenots find shelter in our cities. They bring with them clockmaking, silk weaving and banking."
