l_english:
 estate_hel_communes:0 "Communes"
 estate_hel_communes_desc:0 "The rural communes and the Landleute of the valleys have governed themselves for centuries. Gathered in the Landsgemeinde, they vote on their laws, taxes and alliances, and provide the men of the militia."
 estate_hel_patriciate:0 "Patriciate"
 hel_communes_loyalty_modifier:0 "Communes Loyalty Equilibrium"
 hel_communes_influence_modifier:0 "Communes Influence"
 hel_communes_privilege_slots:0 "Communes Max Privileges"
 hel_local_communes_displeased:0 "Local Communes Displeased"
 hel_people_betrayed:0 "People Betrayed"
 hel_people_betrayed_desc:0 "The people have lost the right to vote on their laws. Anger is rising in the valleys."

 estate_hel_communes_land_rights:0 "Communal Rights"
 estate_hel_communes_land_rights_desc:0 "The communes administer their own lands, alpine pastures and forests."
 estate_hel_communes_primacy:0 "Primacy of the Communes"
 estate_hel_communes_primacy_desc:0 "The communes raise, equip and command their own contingents. No army is raised without them."
 estate_hel_communes_levies:0 "Levy of the Valleys"
 estate_hel_communes_levies_desc:0 "Each valley provides its men to the militia in exchange for lighter taxes."
 estate_hel_communes_officer_corp:0 "Militia Officers"
 estate_hel_communes_officer_corp_desc:0 "Captains elected by the communes lead the militia and pass on the experience of past campaigns."
 estate_hel_communes_advisors:0 "Counsellors of the Valleys"
 estate_hel_communes_advisors_desc:0 "Former captains of the communes advise the Diet on military matters."
 estate_hel_communes_right_of_counsel:0 "Communal Right of Counsel"
 estate_hel_communes_right_of_counsel_desc:0 "Delegates of the communes sit by right in the councils of the Confederation and are consulted on every important matter."
 estate_hel_communes_direct_democracy:0 "Direct Democracy"
 estate_hel_communes_direct_democracy_desc:0 "The assembled people vote on laws and great decisions. This is the strength of the Confederation, but also a constraint: ignoring the will of the people costs dearly in republican legitimacy."

 estate_hel_communes_develop_x:0 "Develop [agenda_province.GetName]"
 estate_hel_communes_develop_x_desc:0 "The Communes ask that we invest in the prosperity of [agenda_province.GetName]. The people have voted and expect action."
 estate_hel_communes_build_fort_building_in_y:0 "Fortify [agenda_province.GetName]"
 estate_hel_communes_build_fort_building_in_y_desc:0 "The Communes call for us to fortify [agenda_province.GetName]. The passes and valleys must be held."
 estate_hel_communes_build_up_manpower_reserves:0 "Build up our Manpower Reserves"
 estate_hel_communes_build_up_manpower_reserves_desc:0 "The valleys have been emptied of their men. The Communes demand a pause so that our reserves can recover."
 estate_hel_communes_crush_revolts:0 "Restore Order"
 estate_hel_communes_crush_revolts_desc:0 "The Communes demand that we restore order and put an end to the revolts."
 estate_hel_communes_retake_core:0 "Retake [agenda_province.GetName]"
 estate_hel_communes_retake_core_desc:0 "[agenda_province.GetName] belongs to the Confederation. The Communes demand that we take it back."
 estate_hel_communes_relations_with_X:0 "Improve Relations with [agenda_country.GetUsableName]"
 estate_hel_communes_relations_with_X_desc:0 "The Communes see [agenda_country.GetUsableName] as a neighbour whose friendship would protect us. They ask that we seek closer ties."
 estate_hel_communes_hire_advisor:0 "Hire a Military Advisor"
 estate_hel_communes_hire_advisor_desc:0 "The Communes wish for a military advisor to sit with the Diet."

 estate_burghers_hel_military_capitulations:0 "Military Capitulations"
 estate_burghers_hel_military_capitulations_desc:0 "The great families negotiate the contracts of our regiments with foreign courts, and draw money and influence from them."
 estate_burghers_hel_renew_capitulations:0 "Renew the Capitulations with [agenda_country.GetUsableName]"
 estate_burghers_hel_renew_capitulations_desc:0 "The Patriciate wishes to renew the contracts of our regiments with [agenda_country.GetUsableName]. To do so, we must win their full trust."
 hel_diet.2.t:0 "Popular Vote"
 hel_diet.2.d:0 "The people are called to vote. The Clergy, the Patriciate and the Communes each submit a proposal. We may adopt one of them, or reject them all at the risk of angering the estates.\n\n[Root.GetCachedAgendasFlavorText]"
 hel_diet_option_communes:0 "The Proposal of the Communes"
 hel_diet.2.refuse:0 "Reject every proposal"
 hel_diet_cooldown_tt:0 "No diet or vote for §Y5§! years."
