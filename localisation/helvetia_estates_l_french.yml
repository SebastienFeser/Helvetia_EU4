l_french:
 estate_hel_communes:0 "Communes"
 estate_hel_communes_desc:0 "Les communes rurales et les Landleute des vallées se gouvernent elles-mêmes depuis des siècles. Réunies en Landsgemeinde, elles votent leurs lois, leurs impôts et leurs alliances, et fournissent les hommes de la milice."
 estate_hel_patriciate:0 "Patriciat"
 hel_communes_loyalty_modifier:0 "Équilibre de loyauté des Communes"
 hel_communes_influence_modifier:0 "Influence des Communes"
 hel_communes_privilege_slots:0 "Privilèges max. des Communes"
 hel_local_communes_displeased:0 "Communes locales mécontentes"
 hel_people_betrayed:0 "Peuple trahi"
 hel_people_betrayed_desc:0 "Le peuple a perdu le droit de voter ses lois. Dans les vallées, la colère gronde."

 estate_hel_communes_land_rights:0 "Droits des communes"
 estate_hel_communes_land_rights_desc:0 "Les communes administrent elles-mêmes leurs terres, leurs alpages et leurs forêts."
 estate_hel_communes_primacy:0 "Primauté des communes"
 estate_hel_communes_primacy_desc:0 "Les communes lèvent, équipent et commandent leurs propres contingents. Aucune armée ne se fait sans elles."
 estate_hel_communes_levies:0 "Levée des vallées"
 estate_hel_communes_levies_desc:0 "Chaque vallée fournit ses hommes à la milice en échange d'un allègement de l'impôt."
 estate_hel_communes_officer_corp:0 "Officiers de milice"
 estate_hel_communes_officer_corp_desc:0 "Les capitaines élus par les communes encadrent la milice et transmettent l'expérience des campagnes."
 estate_hel_communes_advisors:0 "Conseillers des vallées"
 estate_hel_communes_advisors_desc:0 "Les anciens capitaines des communes conseillent la Diète sur les affaires militaires."
 estate_hel_communes_right_of_counsel:0 "Droit de conseil des communes"
 estate_hel_communes_right_of_counsel_desc:0 "Les délégués des communes siègent de droit aux conseils de la Confédération et sont consultés sur toute affaire importante."
 estate_hel_communes_direct_democracy:0 "Démocratie directe"
 estate_hel_communes_direct_democracy_desc:0 "Le peuple réuni vote les lois et les grandes décisions. C'est la force de la Confédération, mais aussi une contrainte : ignorer la volonté populaire coûte cher en légitimité républicaine."

 estate_hel_communes_develop_x:0 "Développer [agenda_province.GetName]"
 estate_hel_communes_develop_x_desc:0 "Les Communes demandent que nous investissions dans la prospérité de [agenda_province.GetName]. Le peuple a voté, il attend des actes."
 estate_hel_communes_build_fort_building_in_y:0 "Fortifier [agenda_province.GetName]"
 estate_hel_communes_build_fort_building_in_y_desc:0 "Les Communes réclament que nous fortifiions [agenda_province.GetName]. Les cols et les vallées doivent être tenus."
 estate_hel_communes_build_up_manpower_reserves:0 "Reconstituer nos réserves d'hommes"
 estate_hel_communes_build_up_manpower_reserves_desc:0 "Les vallées se sont vidées de leurs hommes. Les Communes exigent une pause pour que nos réserves se reconstituent."
 estate_hel_communes_crush_revolts:0 "Rétablir l'ordre"
 estate_hel_communes_crush_revolts_desc:0 "Les Communes exigent que nous rétablissions l'ordre et mettions fin aux révoltes."
 estate_hel_communes_retake_core:0 "Reprendre [agenda_province.GetName]"
 estate_hel_communes_retake_core_desc:0 "[agenda_province.GetName] appartient à la Confédération. Les Communes exigent que nous la reprenions."
 estate_hel_communes_relations_with_X:0 "Améliorer les relations avec [agenda_country.GetUsableName]"
 estate_hel_communes_relations_with_X_desc:0 "Les Communes voient en [agenda_country.GetUsableName] un voisin dont l'amitié nous protégerait. Elles demandent que nous nous en rapprochions."
 estate_hel_communes_hire_advisor:0 "Engager un conseiller militaire"
 estate_hel_communes_hire_advisor_desc:0 "Les Communes souhaitent qu'un conseiller militaire siège auprès de la Diète."

 estate_burghers_hel_military_capitulations:0 "Capitulations militaires"
 estate_burghers_hel_military_capitulations_desc:0 "Les grandes familles négocient les contrats de nos régiments avec les cours étrangères, et en tirent argent et influence."
 estate_burghers_hel_renew_capitulations:0 "Renouveler les capitulations avec [agenda_country.GetUsableName]"
 estate_burghers_hel_renew_capitulations_desc:0 "Le Patriciat souhaite renouveler les contrats de nos régiments avec [agenda_country.GetUsableName]. Il faut pour cela gagner sa pleine confiance."
 hel_diet.2.t:0 "Votation"
 hel_diet.2.d:0 "Le peuple est appelé aux urnes. Le Clergé, le Patriciat et les Communes soumettent chacun un objet au vote. Nous pouvons en adopter un, ou les rejeter tous, au risque de mécontenter les ordres.\n\n[Root.GetCachedAgendasFlavorText]"
 hel_diet_option_communes:0 "La proposition des Communes"
 hel_diet.2.refuse:0 "Rejeter tous les objets"
 hel_diet_cooldown_tt:0 "Aucune Diète ni votation depuis §Y5§! ans."
