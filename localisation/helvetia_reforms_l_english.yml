l_english:
 hel_cantonal_autonomy_reform:0 "Cantonal Autonomy"
 hel_cantonal_autonomy_reform_desc:0 "Each canton keeps its own laws, taxes and courts. The Confederation is an alliance of sovereigns, not a state. Taking this away would be a betrayal the cantons would never forgive."
 hel_federal_militia_reform:0 "Federal Militia"
 hel_federal_militia_reform_desc:0 "Following the Defensional of Wil (1647), each canton provides its contingent to a federal militia army, raised only when the homeland is threatened."
 hel_armed_neutrality_reform:0 "Armed Neutrality"
 hel_armed_neutrality_reform_desc:0 "The Confederation no longer takes sides in the quarrels of the powers. It defends its passes fiercely, but any war of aggression would betray its oath."
 hel_cantons_betrayed:0 "Cantons Betrayed"
 hel_cantons_betrayed_desc:0 "The cantons have lost their autonomy. In the valleys, there is talk of resistance."
 hel_neutrality_broken:0 "Neutrality Broken"
 hel_neutrality_broken_desc:0 "The powers no longer trust our word of neutrality."
 hel_neutrality_defensive_war:0 "Defending Neutrality"
 hel_neutrality_defensive_war_desc:0 "When attacked, the Confederation rises as one."
 hel_neutrality_offensive_war:0 "Neutrality Violated"
 hel_neutrality_offensive_war_desc:0 "A war of aggression contradicts our neutrality. The people and the cantons disapprove."
 hel_cantonal_tolerance:0 "Cantonal Tolerance"
 hel_cantonal_tolerance_desc:0 "A different language is spoken here than in the capital, but the canton governs itself and is no less a member of the Confederation."
 hel_reforms.1.t:0 "Cantonal Tolerance Granted"
 hel_reforms.1.d:0 ""
 hel_reforms.2.t:0 "Cantonal Tolerance Withdrawn"
 hel_reforms.2.d:0 ""
 hel_communal_liberties_reform:0 "Communal Liberties"
 hel_communal_liberties_reform_desc:0 "The valley communes keep their franchises: they elect their judges, manage their pastures and settle their affairs without a lord. In return, they stay loyal to the Confederation."
