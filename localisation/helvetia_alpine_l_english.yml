l_english:
 ALP:0 "Alpine Confederation"
 ALP_ADJ:0 "Alpine"
 HEL_ALP_ideas:0 "Alpine Ideas"
 HEL_ALP_ideas_start:0 "Alpine Traditions"
 HEL_ALP_ideas_bonus:0 "Alpine Ambition"
 hel_alp_pass_tolls:0 "The Pass Tolls"
 hel_alp_pass_tolls_desc:0 "From the Gotthard to the Brenner, from the Simplon to the Mont Cenis, all trade between Italy and the north passes through our passes and pays our toll."
 hel_alp_pestalozzi_school:0 "Pestalozzi's School"
 hel_alp_pestalozzi_school_desc:0 "Johann Heinrich Pestalozzi wants to educate the whole people: head, heart and hand. A people that votes must be able to read."
 hel_alp_alpine_redoubt:0 "The Alpine Redoubt"
 hel_alp_alpine_redoubt_desc:0 "Should the enemy cross our borders, we will fall back into the mountains, where every pass is a fortress."
 hel_alp_perpetual_neutrality:0 "Perpetual Neutrality"
 hel_alp_perpetual_neutrality_desc:0 "The powers recognise and guarantee our neutrality. We take no one's side, and no one threatens us."
 hel_alp_geneva_basel_banks:0 "The Banks of Geneva and Basel"
 hel_alp_geneva_basel_banks_desc:0 "The bankers of Geneva and Basel lend to the courts of all Europe. Their credit is ours."
 hel_alp_federalism:0 "Federalism"
 hel_alp_federalism_desc:0 "Each canton administers itself; the Confederation governs only what is shared. That is how so large a whole remains governable."
 hel_alp_alpine_ports:0 "The Ports of the Alps"
 hel_alp_alpine_ports_desc:0 "Genoa, Venice and Marseille are the outlets of our passes. Our merchants set sail from them."
 hel_alpine_confederation_reform:0 "Confederation of the Alps"
 hel_alpine_confederation_reform_desc:0 "Cantons of every language, from the Rhône to the Danube, united by a federal pact. Together they guard the Alps."
 hel_form_alpine_confederation_title:0 "Form the Alpine Confederation"
 hel_form_alpine_confederation_desc:0 "From the Maritime to the Julian Alps, every pass is ours. The old Confederation becomes the guardian of all the Alps, a neutral power that none dare attack."
