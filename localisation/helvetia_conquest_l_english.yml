l_english:
 hel_swi_romandie_title:0 "Romandy"
 hel_swi_romandie_desc:0 "Vaud and the Valais are held by Savoy, and Geneva wavers between the duke and the Confederates. Bind Geneva through co-citizenship and drive Savoy from the shores of Lake Geneva."
 hel_swi_burgundian_wars_title:0 "The Burgundian Wars"
 hel_swi_burgundian_wars_desc:0 "Charles the Bold dreams of a kingdom between France and the Empire. At Grandson, Murten and Nancy, let us do better than our forefathers: keep Franche-Comté and Burgundy instead of selling them."
 hel_swi_alsace_title:0 "Alsace"
 hel_swi_alsace_desc:0 "Mulhouse has long been our ally. Together with it, let us bring the Sundgau and Alsace into the orbit of the Confederation."
 hel_swi_savoy_dauphine_title:0 "Savoy and Dauphiné"
 hel_swi_savoy_dauphine_desc:0 "The Mont Cenis and Little St Bernard passes open onto Savoy and the Dauphiné. Whoever holds them holds the road to Lyon."
 hel_swi_provence_title:0 "Provence"
 hel_swi_provence_desc:0 "At the end of the road through the southern Alps, Marseille and Toulon open the Mediterranean. As for Avignon, city of the popes, it is not taken: it is negotiated."
 hel_swi_swabian_cities_title:0 "Constance and the Swabian Cities"
 hel_swi_swabian_cities_desc:0 "Constance, Ulm, Augsburg and Memmingen look south. Their burghers dream of 'turning Swiss'. Let us welcome them through co-citizenship or alliance."
 hel_swi_swabian_war_title:0 "The Swabian War"
 hel_swi_swabian_war_desc:0 "In 1499, at Dornach, the Confederates defeated the Emperor and the Swabian League. Let us go further: Württemberg, Baden and the Breisgau."
 hel_swi_palatinate_title:0 "The Palatinate"
 hel_swi_palatinate_desc:0 "The Rhenish Palatinate holds the river downstream from Basel. Let us secure the whole Upper Rhine."
 hel_swi_salzburg_lower_bavaria_title:0 "Salzburg and Lower Bavaria"
 hel_swi_salzburg_lower_bavaria_desc:0 "Salzburg, Passau and Lower Bavaria command the Danube and the northern Alps. Let us gain a foothold in the east."
 hel_swi_bavaria_title:0 "Bavaria"
 hel_swi_bavaria_desc:0 "Munich and Upper Bavaria are the heart of the Wittelsbachs. Their defeat opens the road north."
 hel_swi_franconia_title:0 "Franconia"
 hel_swi_franconia_desc:0 "Nuremberg is the great northern market on the Brenner road to Venice. Let us control both ends of it."
 hel_swi_grisons_title:0 "The Grisons"
 hel_swi_grisons_desc:0 "The Three Leagues are our natural allies and guard the passes of the Engadine and the Splügen. Let us make them Confederates."
 hel_swi_tyrol_title:0 "Gaismair's Tyrol"
 hel_swi_tyrol_desc:0 "In 1526, Michael Gaismair dreamt of a peasant republic in Tyrol and sought the support of Zurich. Let us make his dream come true: Tyrol, the Vorarlberg and Trent."
 hel_swi_austria_title:0 "Austria"
 hel_swi_austria_desc:0 "The hereditary enemy must fall. All the way to Vienna, Styria and Carinthia."
 hel_swi_slovenia_title:0 "Slovenia"
 hel_swi_slovenia_desc:0 "In 1515, the Slovene peasants rose against their lords. Let us support them and complete our hold on the eastern Alps, all the way to Trieste."
 hel_swi_end_of_habsburgs_title:0 "The End of the Habsburgs"
 hel_swi_end_of_habsburgs_desc:0 "The house born at Habsburg Castle, in the Aargau, rules nowhere any more. With it, the Holy Roman Empire collapses."
 hel_swi_ticino_milan_title:0 "Ticino and Milan"
 hel_swi_ticino_milan_desc:0 "At Giornico, we beat Milan for the Ticino. In 1512, we restored the Sforza and protected Milan. Let us make Lombardy a lasting protectorate, or Confederate land."
 hel_swi_po_valley_title:0 "The Po Valley"
 hel_swi_po_valley_desc:0 "Bergamo, Brescia and Mantua link Lombardy to the Veneto."
 hel_swi_piedmont_genoa_title:0 "Piedmont and Genoa"
 hel_swi_piedmont_genoa_desc:0 "Genoa is the natural port of the Swiss passes. Piedmont guards the way to it."
 hel_swi_venetia_title:0 "The Veneto"
 hel_swi_venetia_desc:0 "In 1508, all of Europe joined against Venice at Cambrai. The outlet of the Brenner must be ours."
 hel_swi_corsica_sardinia_title:0 "Corsica and Sardinia"
 hel_swi_corsica_sardinia_desc:0 "As masters of Genoa, we must hold its islands to protect our routes in the Mediterranean."

 hel_unlock_avignon_tt:0 "Unlocks the decision §YNegotiate Avignon§! with the Papacy."
 hel_dismantle_hre_tt:0 "The §RHoly Roman Empire§! will be dismantled."
 hel_negotiate_avignon_title:0 "Negotiate Avignon"
 hel_negotiate_avignon_desc:0 "The city of the popes is not taken by force. Let us offer the Papacy fair compensation, and Avignon will peacefully join the Confederation."
 hel_avignon_bought:0 "Avignon negotiated"
 hel_swiss_way:0 "The Swiss Way"
 hel_brenner_route:0 "The Brenner Road"
