 hel_swi_perpetual_peace_title:0 "La Paix perpétuelle"
 hel_swi_perpetual_peace_desc:0 "Après Marignan, la Confédération a signé avec la France une paix qui a duré presque trois siècles. Gagnons l'amitié durable d'une grande puissance."
 hel_swi_latin_schools_title:0 "Les écoles latines"
 hel_swi_latin_schools_desc:0 "Les chapitres et les couvents des villes forment les futurs magistrats. Dotons nos cantons d'écoles."
 hel_swi_humanist_scholars_title:0 "Les humanistes"
 hel_swi_humanist_scholars_desc:0 "Érasme, Froben et Amerbach ont fait des villes suisses un foyer de l'humanisme. Attirons les grands esprits."
 hel_swi_geneva_academy_title:0 "L'Académie de Genève"
 hel_swi_geneva_academy_desc:0 "En 1559, Genève fonde une académie qui forme les pasteurs et les savants de toute l'Europe. Faisons de Genève une ville du savoir."
 hel_swi_cantonal_schools_title:0 "Les écoles des cantons"
 hel_swi_cantonal_schools_desc:0 "Chaque paroisse doit avoir son maître d'école. Un peuple instruit paie mieux l'impôt et sert mieux la Confédération."
 hel_swi_swiss_scholars_title:0 "Les savants suisses"
 hel_swi_swiss_scholars_desc:0 "Les Bernoulli, Euler et Haller ont porté la science suisse dans toutes les académies d'Europe. Entourons-nous de savants."
 hel_swi_popular_instruction_title:0 "L'instruction populaire"
 hel_swi_popular_instruction_desc:0 "Pestalozzi voulait instruire la tête, le cœur et la main de chaque enfant. Faisons de l'instruction l'affaire de tout le peuple."
 hel_swi_gotthard_toll_title:0 "Le péage du Gothard"
 hel_swi_gotthard_toll_desc:0 "Depuis l'ouverture du col, le Gothard relie le Rhin à la Lombardie. Organisons le passage et prélevons notre part."
 hel_swi_cattle_trade_title:0 "Bétail et fromages"
 hel_swi_cattle_trade_desc:0 "Les bêtes et les fromages des Alpes partent vers les marchés de Lombardie. Développons l'élevage."
 hel_swi_trade_fairs_title:0 "Les foires"
 hel_swi_trade_fairs_desc:0 "Les foires de Genève et de Zurzach attirent les marchands de toute l'Europe. Ouvrons nos villes au commerce."
 hel_swi_alpine_roads_title:0 "Les chemins des cols"
 hel_swi_alpine_roads_desc:0 "Ponts, sentiers et relais rendent les cols praticables toute l'année. Aménageons nos vallées de montagne."
 hel_swi_huguenot_crafts_title:0 "Indiennes et horlogerie"
 hel_swi_huguenot_crafts_desc:0 "Les réfugiés huguenots apportent l'indiennage et l'horlogerie. Accueillons leurs ateliers."
 hel_swi_swiss_banks_title:0 "Les banques suisses"
 hel_swi_swiss_banks_desc:0 "Les banquiers de Genève et de Bâle prêtent aux rois de l'Europe. Tenons nos comptes en ordre."
