 hel_swi_stans_convenant_title:0 "Le Convenant de Stans"
 hel_swi_stans_convenant_desc:0 "En 1481, villes et campagnes ont failli rompre la Confédération. À Stans, sur le conseil de l'ermite Nicolas de Flüe, elles ont trouvé un compromis. Montrons que la Confédération sait se tenir unie."
 hel_swi_integrate_cantons_title:0 "Intégrer les cantons"
 hel_swi_integrate_cantons_desc:0 "Chaque vallée de la Suisse primitive doit se sentir pleinement confédérée. Faisons de nos terres suisses des cantons à part entière."
 hel_swi_federal_diet_title:0 "La Diète fédérale"
 hel_swi_federal_diet_desc:0 "La Tagsatzung réunit les envoyés de tous les cantons. Pour qu'elle fonctionne, le clergé, le patriciat et les communes doivent tous y trouver leur compte."
 hel_swi_confederate_cities_title:0 "Les villes de la Confédération"
 hel_swi_confederate_cities_desc:0 "Berne, Zurich, Bâle et Lucerne sont des places de marché et d'artisanat. Leurs corporations font la richesse de la Confédération."
 hel_swi_thirteen_cantons_title:0 "Les XIII cantons"
 hel_swi_thirteen_cantons_desc:0 "Une Confédération forte repose sur des cantons prospères. Développons le cœur de la Suisse."
 hel_swi_patriciate_and_communes_title:0 "Patriciat et Communes"
 hel_swi_patriciate_and_communes_desc:0 "Les familles des villes et les paysans des vallées se disputent le pouvoir. Il faut contenter les deux."
 hel_swi_zurich_reformation_title:0 "La Réforme zurichoise"
 hel_swi_zurich_reformation_desc:0 "En 1522, à Zurich, des bourgeois rompent le jeûne du Carême en mangeant des saucisses. Zwingli prend leur défense. La Réforme est en marche, et la Confédération doit y répondre."
 hel_swi_voice_of_the_people_title:0 "La voix du peuple"
 hel_swi_voice_of_the_people_desc:0 "Le peuple réuni en Landsgemeinde vote ses lois. Respectons sa voix, et la République en sortira grandie."
 hel_swi_confessional_peace_title:0 "La paix des confessions"
 hel_swi_confessional_peace_desc:0 "Kappel et Villmergen ont montré le prix de la discorde religieuse. Une fois notre voie choisie, il faut ramener la paix entre les cantons."
 hel_swi_peasants_war_title:0 "La guerre des Paysans"
 hel_swi_peasants_war_desc:0 "En 1653, les campagnes se sont soulevées contre les impôts des villes et ont été écrasées. Faisons mieux : gardons les campagnes satisfaites sans avoir à prendre les armes contre elles."
 hel_swi_act_of_mediation_title:0 "L'Acte de Médiation"
 hel_swi_act_of_mediation_desc:0 "La Confédération doit se donner des institutions durables, qui respectent l'autonomie des cantons tout en gouvernant l'ensemble."
 hel_swi_alpine_bastions_title:0 "Les bastions alpins"
 hel_swi_alpine_bastions_desc:0 "Les cols sont nos remparts. Fortifions les montagnes, et aucune armée ne passera."
 hel_swi_swiss_guard_title:0 "La Garde suisse"
 hel_swi_swiss_guard_desc:0 "Le pape, comme le roi de France, veut des Suisses pour garde. Gagnons la confiance des cours étrangères."
 hel_swi_mercenary_companies_title:0 "Les compagnies de mercenaires"
 hel_swi_mercenary_companies_desc:0 "Nos régiments se louent dans toute l'Europe. Organisons ce commerce pour qu'il serve aussi la Confédération."
 hel_swi_defensional_of_wil_title:0 "Le Défensional de Wil"
 hel_swi_defensional_of_wil_desc:0 "En 1647, pour se protéger de la guerre de Trente Ans, les cantons ont créé une armée fédérale commune. Professionnalisons notre défense."
 hel_swi_recognized_neutrality_title:0 "La neutralité reconnue"
 hel_swi_recognized_neutrality_desc:0 "Une neutralité ne vaut que si les puissances y croient. Vingt ans de paix et une armée prête à défendre les cols la rendront incontestable."

 hel_unlock_cantonal_autonomy_tt:0 "Débloque la réforme §YAutonomie cantonale§!."
 hel_unlock_armed_neutrality_tt:0 "Débloque la réforme §YNeutralité armée§!."
 hel_twenty_years_of_peace_tt:0 "Aucune guerre depuis au moins §Y20 ans§!."

