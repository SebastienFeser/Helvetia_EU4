l_english:
 hel_religion.1.t:0 "The Confederation at a Crossroads"
 hel_religion.1.d:0 "Zurich, Bern and Basel have embraced the Reformation, while the cantons of Central Switzerland remain loyal to Rome. At Trent, the Church is preparing its answer to the heretics. The two camps have already clashed at Kappel. The Diet must decide which path the Confederation will follow: that of Rome, that of the reformers, or a peace that leaves each canton free in its faith."
 hel_religion.1.a:0 "Rome. The Confederation will remain loyal to the Church."
 hel_religion.1.b:0 "Zurich and Geneva. The Confederation will be Reformed."
 hel_religion.1.c:0 "The peace of the confessions. Each canton keeps its faith."
 hel_renounce_confessional_neutrality_title:0 "Renounce Confessional Neutrality"
 hel_renounce_confessional_neutrality_desc:0 "End the peace of the confessions to impose a single faith. The cantons will not accept it quietly, and there will be no going back."
 hel_golden_league:0 "The Golden League"
 hel_golden_league_desc:0 "The Catholic cantons have united to defend the faith of Rome."
 hel_helvetic_reformation:0 "The Helvetic Reformation"
 hel_helvetic_reformation_desc:0 "From Zurich to Geneva, the Reformed faith shapes the Confederation."
 hel_confessional_neutrality:0 "Confessional Neutrality"
 hel_confessional_neutrality_desc:0 "Each canton chooses its faith. No one converts their neighbour, and Christians of every confession live in peace under the same banner."
 hel_confessions_torn:0 "Confessions Torn Apart"
 hel_confessions_torn_desc:0 "The peace of the confessions is broken. The cantons distrust one another."
