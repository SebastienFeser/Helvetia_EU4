l_german:
 hel_cantonal_autonomy_reform:0 "Kantonale Autonomie"
 hel_cantonal_autonomy_reform_desc:0 "Jeder Ort behält seine Gesetze, Steuern und Gerichte. Die Eidgenossenschaft ist ein Bund von Souveränen, kein Staat. Ihnen dies zu nehmen, wäre ein Verrat, den die Orte nie verzeihen würden."
 hel_federal_militia_reform:0 "Eidgenössische Miliz"
 hel_federal_militia_reform_desc:0 "Nach dem Vorbild des Defensionals von Wil (1647) stellt jeder Ort sein Kontingent für ein eidgenössisches Milizheer, das nur aufgeboten wird, wenn das Vaterland bedroht ist."
 hel_armed_neutrality_reform:0 "Bewaffnete Neutralität"
 hel_armed_neutrality_reform_desc:0 "Die Eidgenossenschaft ergreift im Streit der Mächte keine Partei mehr. Sie verteidigt ihre Pässe erbittert, doch jeder Angriffskrieg würde ihren Eid verraten."
 hel_cantons_betrayed:0 "Verratene Orte"
 hel_cantons_betrayed_desc:0 "Die Orte haben ihre Autonomie verloren. In den Tälern spricht man von Widerstand."
 hel_neutrality_broken:0 "Gebrochene Neutralität"
 hel_neutrality_broken_desc:0 "Die Mächte glauben unserem Neutralitätsversprechen nicht mehr."
 hel_neutrality_defensive_war:0 "Verteidigung der Neutralität"
 hel_neutrality_defensive_war_desc:0 "Angegriffen erhebt sich die Eidgenossenschaft wie ein Mann."
 hel_neutrality_offensive_war:0 "Verletzte Neutralität"
 hel_neutrality_offensive_war_desc:0 "Ein Angriffskrieg widerspricht unserer Neutralität. Volk und Orte missbilligen ihn."
 hel_cantonal_tolerance:0 "Kantonale Toleranz"
 hel_cantonal_tolerance_desc:0 "Hier spricht man eine andere Sprache als in der Hauptstadt, doch der Ort regiert sich selbst und ist nicht weniger eidgenössisch."
