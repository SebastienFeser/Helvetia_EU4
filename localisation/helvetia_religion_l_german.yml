l_german:
 hel_religion.1.t:0 "Die Eidgenossenschaft am Scheideweg"
 hel_religion.1.d:0 "Zürich, Bern und Basel haben die Reformation angenommen, während die Orte der Innerschweiz Rom treu bleiben. In Trient bereitet die Kirche ihre Antwort auf die Ketzer vor. Bei Kappel sind die beiden Lager bereits aufeinandergeprallt. Die Tagsatzung muss entscheiden, welchen Weg die Eidgenossenschaft geht: den Roms, den der Reformatoren oder einen Frieden, der jedem Ort seinen Glauben lässt."
 hel_religion.1.a:0 "Rom. Die Eidgenossenschaft bleibt der Kirche treu."
 hel_religion.1.b:0 "Zürich und Genf. Die Eidgenossenschaft wird reformiert."
 hel_religion.1.c:0 "Der Konfessionsfriede. Jeder Ort behält seinen Glauben."
 hel_renounce_confessional_neutrality_title:0 "Konfessionelle Neutralität aufgeben"
 hel_renounce_confessional_neutrality_desc:0 "Den Konfessionsfrieden beenden, um einen einzigen Glauben durchzusetzen. Die Orte werden dies nicht kampflos hinnehmen, und es gibt kein Zurück."
 hel_golden_league:0 "Der Goldene Bund"
 hel_golden_league_desc:0 "Die katholischen Orte haben sich zusammengeschlossen, um den Glauben Roms zu verteidigen."
 hel_helvetic_reformation:0 "Die Helvetische Reformation"
 hel_helvetic_reformation_desc:0 "Von Zürich bis Genf prägt der reformierte Glaube die Eidgenossenschaft."
 hel_confessional_neutrality:0 "Konfessionelle Neutralität"
 hel_confessional_neutrality_desc:0 "Jeder Ort wählt seinen Glauben. Niemand bekehrt seinen Nachbarn, und Christen aller Bekenntnisse leben in Frieden unter demselben Banner."
 hel_confessions_torn:0 "Zerrissene Konfessionen"
 hel_confessions_torn_desc:0 "Der Konfessionsfriede ist gebrochen. Die Orte misstrauen einander."
