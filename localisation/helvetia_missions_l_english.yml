l_english:
 hel_swi_stans_convenant_title:0 "The Covenant of Stans"
 hel_swi_stans_convenant_desc:0 "In 1481, town and country nearly tore the Confederation apart. At Stans, on the advice of the hermit Nicholas of Flüe, they found a compromise. Let us show that the Confederation can stand united."
 hel_swi_integrate_cantons_title:0 "Integrate the Cantons"
 hel_swi_integrate_cantons_desc:0 "Every valley of old Switzerland must feel fully confederate. Let us make our Swiss lands cantons in their own right."
 hel_swi_federal_diet_title:0 "The Federal Diet"
 hel_swi_federal_diet_desc:0 "The Tagsatzung gathers the envoys of every canton. For it to work, the clergy, the patriciate and the communes must all have their say."
 hel_swi_confederate_cities_title:0 "Cities of the Confederation"
 hel_swi_confederate_cities_desc:0 "Bern, Zurich, Basel and Lucerne are centres of trade and craft. Their guilds are the wealth of the Confederation."
 hel_swi_thirteen_cantons_title:0 "The Thirteen Cantons"
 hel_swi_thirteen_cantons_desc:0 "A strong Confederation rests on prosperous cantons. Let us develop the heart of Switzerland."
 hel_swi_patriciate_and_communes_title:0 "Patriciate and Communes"
 hel_swi_patriciate_and_communes_desc:0 "The families of the towns and the peasants of the valleys vie for power. Both must be satisfied."
 hel_swi_zurich_reformation_title:0 "The Zurich Reformation"
 hel_swi_zurich_reformation_desc:0 "In 1522, in Zurich, townsmen break the Lenten fast by eating sausages. Zwingli takes their side. The Reformation is under way, and the Confederation must respond."
 hel_swi_voice_of_the_people_title:0 "The Voice of the People"
 hel_swi_voice_of_the_people_desc:0 "The people gathered in the Landsgemeinde vote on their laws. Let us respect their voice, and the Republic will be the stronger for it."
 hel_swi_confessional_peace_title:0 "Peace of the Confessions"
 hel_swi_confessional_peace_desc:0 "Kappel and Villmergen have shown the price of religious strife. Once our path is chosen, we must bring peace back between the cantons."
 hel_swi_peasants_war_title:0 "The Peasants' War"
 hel_swi_peasants_war_desc:0 "In 1653, the countryside rose against the taxes of the towns and was crushed. Let us do better: keep the countryside content without ever taking up arms against it."
 hel_swi_act_of_mediation_title:0 "The Act of Mediation"
 hel_swi_act_of_mediation_desc:0 "The Confederation must give itself lasting institutions that respect the autonomy of the cantons while governing the whole."
 hel_swi_alpine_bastions_title:0 "Alpine Bastions"
 hel_swi_alpine_bastions_desc:0 "The passes are our ramparts. Let us fortify the mountains, and no army shall pass."
 hel_swi_swiss_guard_title:0 "The Swiss Guard"
 hel_swi_swiss_guard_desc:0 "The Pope, like the King of France, wants Swiss guards. Let us win the trust of foreign courts."
 hel_swi_mercenary_companies_title:0 "Mercenary Companies"
 hel_swi_mercenary_companies_desc:0 "Our regiments serve across Europe. Let us organise this trade so that it also serves the Confederation."
 hel_swi_defensional_of_wil_title:0 "The Defensional of Wil"
 hel_swi_defensional_of_wil_desc:0 "In 1647, to protect themselves from the Thirty Years' War, the cantons created a common federal army. Let us professionalise our defence."
 hel_swi_recognized_neutrality_title:0 "Recognised Neutrality"
 hel_swi_recognized_neutrality_desc:0 "Neutrality is only worth something if the powers believe in it. Twenty years of peace and an army ready to defend the passes will make it unquestionable."

 hel_unlock_cantonal_autonomy_tt:0 "Unlocks the §YCantonal Autonomy§! reform."
 hel_unlock_armed_neutrality_tt:0 "Unlocks the §YArmed Neutrality§! reform."
 hel_twenty_years_of_peace_tt:0 "No war for at least §Y20 years§!."

