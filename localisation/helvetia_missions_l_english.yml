 hel_swi_perpetual_peace_title:0 "The Perpetual Peace"
 hel_swi_perpetual_peace_desc:0 "After Marignano, the Confederation signed a peace with France that lasted almost three centuries. Let us win the lasting friendship of a great power."
 hel_swi_latin_schools_title:0 "The Latin Schools"
 hel_swi_latin_schools_desc:0 "The chapters and convents of the towns train the future magistrates. Let us give our cantons schools."
 hel_swi_humanist_scholars_title:0 "The Humanists"
 hel_swi_humanist_scholars_desc:0 "Erasmus, Froben and Amerbach made the Swiss towns a centre of humanism. Let us attract great minds."
 hel_swi_geneva_academy_title:0 "The Academy of Geneva"
 hel_swi_geneva_academy_desc:0 "In 1559 Geneva founded an academy that trained pastors and scholars from all over Europe. Let us make Geneva a city of learning."
 hel_swi_cantonal_schools_title:0 "The Cantonal Schools"
 hel_swi_cantonal_schools_desc:0 "Every parish must have its schoolmaster. An educated people pays its taxes better and serves the Confederation better."
 hel_swi_swiss_scholars_title:0 "The Swiss Scholars"
 hel_swi_swiss_scholars_desc:0 "The Bernoullis, Euler and Haller carried Swiss science into every academy in Europe. Let us surround ourselves with scholars."
 hel_swi_popular_instruction_title:0 "Popular Education"
 hel_swi_popular_instruction_desc:0 "Pestalozzi wanted to educate the head, heart and hand of every child. Let us make education the business of the whole people."
 hel_swi_gotthard_toll_title:0 "The Gotthard Toll"
 hel_swi_gotthard_toll_desc:0 "Since the pass was opened, the Gotthard has linked the Rhine to Lombardy. Let us organise the crossing and take our share."
 hel_swi_cattle_trade_title:0 "Cattle and Cheese"
 hel_swi_cattle_trade_desc:0 "Alpine cattle and cheese go to the markets of Lombardy. Let us develop our herds."
 hel_swi_trade_fairs_title:0 "The Fairs"
 hel_swi_trade_fairs_desc:0 "The fairs of Geneva and Zurzach attract merchants from all over Europe. Let us open our towns to trade."
 hel_swi_alpine_roads_title:0 "The Mountain Roads"
 hel_swi_alpine_roads_desc:0 "Bridges, paths and relay stations keep the passes open all year. Let us develop our mountain valleys."
 hel_swi_huguenot_crafts_title:0 "Printed Cottons and Watchmaking"
 hel_swi_huguenot_crafts_desc:0 "Huguenot refugees bring cotton printing and watchmaking. Let us welcome their workshops."
 hel_swi_swiss_banks_title:0 "The Swiss Banks"
 hel_swi_swiss_banks_desc:0 "The bankers of Geneva and Basel lend to the kings of Europe. Let us keep our accounts in order."
