l_german:
 HEL_SWI_ideas:0 "Schweizer Ideen"
 HEL_SWI_ideas_start:0 "Schweizer Traditionen"
 HEL_SWI_ideas_bonus:0 "Schweizer Ambitionen"
 hel_swi_piquiers:0 "Die Spiessträger"
 hel_swi_piquiers_desc:0 "Dicht gedrängt in Gewalthaufen voller Spiesse zerschlugen die Eidgenossen das burgundische Rittertum bei Grandson, Murten und Nancy. Keine Infanterie Europas kann ihnen standhalten."
 hel_swi_milice_cantonale:0 "Die kantonale Miliz"
 hel_swi_milice_cantonale_desc:0 "In den Orten muss jeder freie Mann Waffen tragen. Jedes Tal kann seine Männer innert weniger Tage aufbieten, ganz ohne stehendes Heer."
 hel_swi_reislaufen:0 "Das Reislaufen"
 hel_swi_reislaufen_desc:0 "Die Könige von Frankreich, die Päpste und die Herzöge von Mailand werben um unsere Söldner. Die Kapitulationen bringen fremdes Gold in die Orte und verschaffen unseren Männern unvergleichliche Erfahrung."
 hel_swi_commerce_betail:0 "Der Viehhandel"
 hel_swi_commerce_betail_desc:0 "Jeden Herbst ziehen unsere Herden und Käse über die Pässe zu den Märkten der Lombardei. Die Alpweiden sind der Reichtum der Täler."
 hel_swi_bale_imprimeuse:0 "Basel, die Druckerstadt"
 hel_swi_bale_imprimeuse_desc:0 "Seit der Gründung seiner Universität 1460 zieht Basel Gelehrte und Drucker an. Frobens Pressen drucken Erasmus, und neue Ideen verbreiten sich in ganz Europa."
 hel_swi_zwingli_bullinger:0 "Zwingli und Bullinger"
 hel_swi_zwingli_bullinger_desc:0 "In Zürich gaben Zwingli und nach ihm Bullinger dem Glauben eine gemeinsame Strenge und Lehre, festgehalten im Helvetischen Bekenntnis von 1566."
 hel_swi_refuge_huguenot:0 "Das Hugenotten-Refuge"
 hel_swi_refuge_huguenot_desc:0 "Aus Frankreich vertrieben, finden die Hugenotten Zuflucht in unseren Städten. Sie bringen Uhrmacherei, Seidenweberei und Bankwesen mit."
